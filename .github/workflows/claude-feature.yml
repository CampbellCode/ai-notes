name: Implement Feature with Claude

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'claude-feature'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create feature branch
        id: branch
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//' | cut -c1-40)
          BRANCH="feature/issue-${ISSUE_NUMBER}-${SLUG}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PROMPT="You are implementing a feature for the ai-notes PWA.

          Read CLAUDE.md first — it explains the full architecture. The entire app lives in frontend/index.html (single HTML file, inline CSS and JS, no build step, no framework). If you change index.html, also bump the CACHE version string in frontend/sw.js so the service worker picks up the changes.

          Feature request (Issue #${ISSUE_NUMBER}): ${ISSUE_TITLE}

          ${ISSUE_BODY}

          Implement this feature now. Make only the necessary code changes."

          claude -p "$PROMPT" --allowedTools "Read,Edit,Write" --model claude-haiku-4-5-20251001

      - name: Commit changes
        id: commit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add frontend/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "${ISSUE_TITLE}

          Implements #${ISSUE_NUMBER}

          Co-Authored-By: Claude <noreply@anthropic.com>"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push and open PR
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push --force origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}

          Automated implementation of the feature requested in issue #${ISSUE_NUMBER}.

          > Generated by Claude Code" \
            --base main \
            --head "$BRANCH" \
            --reviewer CampbellCode)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR_URL" --auto --merge

      - name: Comment on issue — PR ready
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "PR ready for your review: ${{ steps.pr.outputs.pr_url }}"

      - name: Comment on issue — no changes made
        if: steps.commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "Claude ran but made no code changes. Try adding more detail to the issue description."
